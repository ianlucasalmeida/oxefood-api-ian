<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bem-vindo ao OxeFood</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    
    <div style="max-width: 600px; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: auto;">
        
        <h2 style="color: #ff6600;">Bem-vindo ao OxeFood!</h2>
        
        <p style="font-size: 16px; color: #333333;">
            Olá, <strong th:text="${nomeCliente}">Nome do Cliente</strong>!
        </p>
        
        <p style="font-size: 16px; color: #333333;">
            Seu cadastro foi realizado com sucesso. Agora ficou muito mais fácil e seguro realizar os seus pedidos com a gente.
        </p>
        
        <p style="font-size: 16px; color: #333333;">
            Aproveite as nossas promoções e bom apetite!
        </p>
        
        <hr style="border: 0; border-top: 1px solid #eeeeee; margin: 20px 0;">
        
        <p style="font-size: 12px; color: #999999; text-align: center;">
            Equipe OxeFood - IFPE Jaboatão dos Guararapes
        </p>
    </div>

</body>
</html>
